<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background with Squircle Shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Border Glow -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ea580c" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Shield -->
  <g filter="url(#shadow)">
    <path d="M 256 90 L 370 140 C 370 270 256 360 256 410 C 256 360 142 270 142 140 Z" 
          fill="url(#shieldGrad)" 
          stroke="#fed7aa" 
          stroke-width="6" 
          stroke-linejoin="round" />
  </g>

  <!-- Safety Fire Emblem inside Shield -->
  <path d="M 256 160 C 285 210 320 250 305 305 C 290 350 250 365 240 365 C 270 335 270 300 250 275 C 240 310 215 325 210 350 C 190 330 185 295 205 260 C 220 235 250 200 256 160 Z"
        fill="url(#flameGrad)" />

  <!-- Inner Spark -->
  <circle cx="256" cy="320" r="14" fill="#ffffff" opacity="0.9" />
</svg>
